<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #1a1a2e; color: white; height: 100vh; display: flex; flex-direction: column; }
.header { background: #16213e; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; color: #00d4ff; }
.chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
.message { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 15px; line-height: 1.5; }
.user { background: #0f3460; align-self: flex-end; }
.ai { background: #16213e; align-self: flex-start; border: 1px solid #00d4ff33; }
.input-area { background: #16213e; padding: 15px; display: flex; gap: 10px; }
.input-area input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #00d4ff; background: #1a1a2e; color: white; font-size: 15px; outline: none; }
.input-area button { padding: 12px 20px; border-radius: 25px; border: none; background: #00d4ff; color: #1a1a2e; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div class="header">🤖 AI Assistant</div>
<div class="chat-box" id="chatBox">
<div class="message ai">আসসালামুয়ালাইকুম! আমি তোমার AI Assistant।</div>
</div>
<div class="input-area">
<input type="text" id="userInput" placeholder="বাংলায় লিখুন..." onkeypress="if(event.key==='Enter')sendMessage()">
<button onclick="sendMessage()">পাঠাও</button>
</div>
<script>
async function sendMessage() {
  const input = document.getElementById('userInput');
  const msg = input.value.trim();
  if (!msg) return;
  addMessage(msg, 'user');
  input.value = '';
  try {
    const res = await fetch('http://localhost:3000/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msg})
    });
    const data = await res.json();
    if (data.success) addMessage(data.reply, 'ai');
    else addMessage('সমস্যা হয়েছে!', 'ai');
  } catch(e) {
    addMessage('Server এর সাথে সংযোগ নেই!', 'ai');
  }
}
function addMessage(text, type) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'message ' + type;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
